name: ci

# 公开仓最小权限：CI 只需读代码，防止 fork PR 借 token 写仓库
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iclip_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # CI 上不许静默 skip：给了地址，跑不起来就是红的。
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: Sync dependencies (lockfile 精确 pin)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run pyright
      - name: Architecture graph
        run: uv run tach check
      - name: Default test gate (real Postgres)
        run: uv run pytest -m "unit or integration_no_llm"
      - name: Install ffmpeg (导出合同要把整个 app 装配起来，shot_video 启动时检查它)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Contract check (openapi.json 与后端一致)
        run: uv run python scripts/dump_openapi.py --check
      - name: Docs check (链接与 make 目标存在)
        run: python3 ../scripts/check-docs.py
      - name: Alembic to head against service Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/iclip_test
        run: uv run alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # monorepo 根目录无 package.json，需显式指到 web/ 读 packageManager
          package_json_file: web/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: ci:check
        run: pnpm ci:check
      - name: Build
        run: pnpm build
      # e2e 不进 ci:check：要装浏览器、要起 dev 服务器，本地按需跑，CI 每次都跑
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: e2e (browser MSW as backend)
        run: pnpm test:e2e
