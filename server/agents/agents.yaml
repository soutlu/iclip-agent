# Agent 装配声明；运行参数见 configs/config.yaml。
# 键名作为 agent id 与 name；spec 路径相对本目录，model 引用配置中的 models 键。
# spec 同目录的 instructions.md 自动并入提示词；skills 按本目录 skills/ 下的目录名引用。
# capabilities 在 src/iclip/app/capability_table.py 注册，子 agent 仅启用显式声明的能力。
# shot_video 依赖 workspace、视频理解接口与媒体生成配置，缺少依赖时装配失败。

agent:
  assistant:
    spec: assistant/agent.yaml
    model: glm-5.3-flash

  storyboard:
    spec: storyboard/agent.yaml
    model: glm-5.3-flash
    skills:
      - storyboard-workflow
    capabilities:
      - workspace
      - shot_video
