# 唯一 Runtime Configuration。YAML 只存环境变量名（*_env），不存任何密钥值。
app:
  name: iclip-agent

db:
  url_env: ICLIP_DATABASE_URL
  schema: iclip

security:
  secret_env: ICLIP_AUTH_SECRET
  session_cookie_name: iclip_session
  session_lifetime_seconds: 604800
  cookie_secure: false
  cors_allow_origins: []

sso:
  base_url_env: WANGOON_SSO_BASE_URL # env 为空即 SSO 关闭（/auth/sso/* 不挂载）
  app_name: iclip
  redirect_url_env: ICLIP_SSO_REDIRECT_URL
  root_email_env: ICLIP_ROOT_EMAIL # 该邮箱 SSO 登录即自动持有 root 角色；env 为空即关闭引导

pms:
  base_url_env: WANGOON_PMS_BASE_URL # env 为空即关闭 SSO 登录时的 PMS 资料同步

redis:
  # agent 运行的事件流。声明了 agent 就必须配这一段，否则启动即报错。
  url_env: ICLIP_REDIS_URL
  replay_window_seconds: 3600 # 运行结束后事件还能重放多久
  max_frames: 100000 # 单次运行的事件上限，超了就中断（可重试）
  max_connections: 64 # 同时能有多少人在读事件流：每个读者占住一条连接

models:
  # 键名即模型名，也是 agents.yaml 里 model 字段引用的名字。
  # provider 是官方 provider 名，决定厂商适配；api 不写即 chat。
  qwen3.8-max:
    provider: alibaba
    api: responses
    api_key_env: ALIBABA_API_KEY
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # 新加坡站换 dashscope-intl

ops:
  log_level: INFO
