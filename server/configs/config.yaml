# 运行配置；环境变量定义见 src/iclip/config/models.py。
app:
  name: iclip-agent

db:
  schema: iclip

security:
  session_cookie_name: iclip_session
  session_lifetime_seconds: 604800
  cookie_secure: false
  cors_allow_origins: []

sso:
  # SSO_BASE_URL 为空时不挂载 /auth/sso/*。
  app_name: iclip

media_generation:
  # VIDEO_SUBMIT_URL 为空时关闭生成路由与后台队列；启用后须提供生成接口与对象存储凭证。
  video:
    model: mmt-seedance-2-0 # 供应方模型名
    user_name: iclip-agent # 供应方对账使用的稳定调用方标识
  image:
    user_name: iclip-agent
  poll_interval_seconds: 5 # 状态查询间隔，固定轮询
  job_timeout_seconds: 3600 # 提交后等待终态的上限

shot_video:
  # VIDEO_UNDERSTANDING_URL 为空时不注册 shot_video；启用后须同时启用媒体生成。
  understanding_model: doubao-seed-2-0-lite-260428 # 供应方模型名
  understanding_thinking: medium # minimal / low / medium / high；省略时使用供应方默认值
  # 采样帧率范围 0.2–5；提高帧率有助于识别快速剪辑点，同时增加视频 token 消耗。
  understanding_fps: 5
  # 出图先使用 dev 渠道，耗尽 dev_attempts 后转 pro；成功后停止重试。
  poll_interval_seconds: 5 # 结果轮询间隔
  dev_attempts: 2
  pro_attempts: 1
  backoff_seconds: 5 # 初次重试间隔，后续乘以 backoff_factor
  backoff_factor: 3
  job_timeout_seconds: 1800 # 单次出图工具调用的总时限

models:
  # 键名即模型名，也是 agents.yaml 里 model 字段引用的名字。
  # provider 是官方 provider 名，决定厂商适配；api 不写即 chat。
  # thinking 是思考强度：none / minimal / low / medium / high / xhigh / max，不写即厂商默认档。
  # api_key_env 指定该模型 API key 所在的环境变量。
  glm-5.3-flash:
    provider: alibaba
    model: ZHIPU/GLM-5.3-Flash
    # 使用默认 chat 接口：百炼 Responses 流在并行工具调用开始事件中重复首个工具的名称与参数，
    # 会导致解析器错误识别后续调用。
    api_key_env: MODEL_API_KEY
    base_url: https://llm-dd2phm2wuagx7ezo.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    thinking: high
    context_window: 1048576

conversations:
  title_model: glm-5.3-flash # 引用 models 键名；省略时禁用自动标题
  compaction:
    # 压缩阈值为 context_window × max_fraction；未配置窗口时禁用压缩。
    max_fraction: 0.85 # 历史估算占窗口的触发比例
    keep_messages: 20 # 摘要之后保留的原始消息条数

agent_runs:
  # lease_seconds 必须大于 heartbeat_seconds。
  heartbeat_seconds: 10 # 运行期间的心跳间隔
  lease_seconds: 30 # 心跳失联判定时限；超时后由清扫续跑或判失败
  sweep_seconds: 15 # 中断清扫与队列唤醒间隔
  max_attempts: 2 # 单条消息的最大认领次数；1 表示中断后不续跑
  max_snapshots_per_run: 3 # 每个 run 保留的全量历史快照数

ops:
  log_level: INFO
