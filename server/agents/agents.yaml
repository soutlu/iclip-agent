# Agent 装配声明。与 configs/config.yaml 分工：那一份是运维配置（只存 env 变量名），
# 这一份是产品资产的装配声明——启用哪些 agent、各自用哪份 spec、谁带谁。
#
# 键名即 agent id：它同时是 URL 里的 {agent_id}，也会被强制写成 agent 的 name
# （落库与提示词里出现的就是它）。spec 路径相对本文件所在目录。
# model 引用 configs/config.yaml 的 models 段键名，必填。
# 每个 spec 同目录下的 instructions.md 会作为提示词自动并入（没有该文件即不并）。
#
# skills 从本文件同级的 skills/ 库里按目录名挑（一个子目录一个 skill，含 SKILL.md）；
# capabilities 是 capability 名，实现登记在 src/iclip/app/capability_table.py；目前已
# 登记的有 workspace（一段对话一个文本工作区，主 agent 与下属共用）和 shot_video（拆参
# 考片、取帧、出图、切格；要 VIDEO_UNDERSTANDING_URL 与媒体生成都开着才登记得上，否则
# 引用它会在装配期报错）。两者都是不写即不挂，而且子 agent 不继承主 agent 的——下属只
# 拥有显式给它的那几样。
#
# 形状示例（真实内容由使用者填写）：
#
# agent:
#   storyboard:                          # 单 agent
#     spec: storyboard/agent.yaml
#     model: qwen3.8-max
#     skills:                            # 挑 skills/ 库里的哪几个
#       - storyboard-workflow
#     capabilities:                      # 挂哪几个 capability
#       - workspace
#
#   producer:                            # 主 + 从
#     spec: producer/agent.yaml
#     model: qwen3.8-max
#     subagent:
#       # 以下三个字段名与 harness SubAgent 一致，是本仓对 harness 的唯一泄漏面。
#       - spec: shot-writer/agent.yaml
#         model: qwen3.8-max
#         skills: [storyboard-workflow]  # 下属各挂各的
#         timeout_seconds: 180           # 单次派活墙钟上限（秒）
#         max_calls: 3                   # 单轮最多派几次
#       - spec: researcher/agent.yaml
#         on_failure: 失败就基于现有信息继续，不要反复重试。

agent:
  assistant:
    spec: assistant/agent.yaml
    model: qwen3.8-max
