# 唯一 Runtime Configuration。
#
# 这份文件说「装什么、什么形状」；地址与凭证一概不在这里，它们由环境变量提供，
# 清单见 src/iclip/config/models.py 里那几个 *Env 类。
app:
  name: iclip-agent

db:
  schema: iclip

security:
  session_cookie_name: iclip_session
  session_lifetime_seconds: 604800
  cookie_secure: false
  cors_allow_origins: []

sso:
  # 我们在对方那边注册的应用名。整项 SSO 的开关是 SSO_BASE_URL 这个环境变量：
  # 为空即关闭（/auth/sso/* 不挂载）。
  app_name: iclip

media_generation:
  # 媒体生成。开关是 VIDEO_SUBMIT_URL 这个环境变量：为空即整项关闭（/generations
  # 不挂载、后台不跑）；一旦非空，那一组地址与对象存储的凭证就都是必需的。
  video:
    model: mmt-seedance-2-0 # 对方的模型名，不是本仓 models 段里的键
    user_name: iclip-agent # 对方要求的稳定调用方标识，用于它那边对账
  image:
    user_name: iclip-agent
  # 后台队列的节奏。并发、错误重试间隔、关停宽限、心跳是实现细节，默认值在代码里。
  poll_interval_seconds: 5 # 每隔多久查一次状态（固定间隔，不做退避）
  job_timeout_seconds: 3600 # 提交后超过这么久还没终态就判失败

shot_video:
  # 镜头素材能力（capability 名 shot_video）：拆参考片、取帧、出图、切格。
  # 开关是 VIDEO_UNDERSTANDING_URL 这个环境变量：为空即整项关闭（名字不登记，
  # agent 声明里引用它会在装配期报错）。它建立在媒体生成之上——出图走生成域，
  # 帧与切格产物落生成用的那个公开对象存储——所以生成没开时配了这一段即启动报错。
  understanding_model: doubao-seed-2-0-lite-260428 # 对方的模型名，不是 models 段的键
  understanding_thinking: medium # minimal / low / medium / high 四档；不写即用对方默认档
  # 每秒看几帧，0.2-5。对方默认 1 帧，快剪片一秒切两三刀就看不见剪辑点、时间码全压在整秒上；
  # 5 帧下视频 token 约涨 4 倍，单次拆解耗时不变。
  understanding_fps: 5
  # 出图的等待与重试。渠道从 dev 起，试满 dev_attempts 次还不成再升 pro；任何失败
  # 都往下试，出了图就停。
  poll_interval_seconds: 5 # 提交之后隔多久查一次结果
  dev_attempts: 2
  pro_attempts: 1
  backoff_seconds: 5 # 首次重试前等多久，之后逐次乘以 backoff_factor
  backoff_factor: 3
  job_timeout_seconds: 1800 # 一次出图工具调用总共等多久

models:
  # 键名即模型名，也是 agents.yaml 里 model 字段引用的名字。
  # provider 是官方 provider 名，决定厂商适配；api 不写即 chat。
  # thinking 是思考强度：none / minimal / low / medium / high / xhigh / max，不写即厂商默认档。
  #
  # api_key_env 是这里唯一还留着「变量名」的地方：每个模型各自一把 key，用哪个变量
  # 取是这条声明的一部分，没法用一套写死的名字表达。
  glm-5.3-flash:
    provider: alibaba
    model: ZHIPU/GLM-5.3-Flash
    # 走 chat 而不是 responses：百炼的 Responses 流式接口在一次并行调用多个工具时，
    # 第二个起的工具名与参数会先报成第一个的、到结束事件才改对，而解析只认开头那一下，
    # 后面的调用就全变成第一个的复制品，流程里的步骤会被静默吞掉。chat 接口没有这个问题。
    api_key_env: MODEL_API_KEY
    base_url: https://llm-dd2phm2wuagx7ezo.cn-beijing.maas.aliyuncs.com/compatible-mode/v1
    thinking: high

conversations:
  title_model: glm-5.3-flash # 给对话起标题的模型，取 models 段的键名；不配就不起标题

ops:
  log_level: INFO
